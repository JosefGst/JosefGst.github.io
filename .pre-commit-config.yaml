repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/tcort/markdown-link-check
    rev: v3.14.2
    hooks:
    - id: markdown-link-check
      args: [-q]